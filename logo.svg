<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background squircle gradient: midnight navy to deep electric violet -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121330"/>
      <stop offset="45%" stop-color="#1B1745"/>
      <stop offset="100%" stop-color="#2D1C5E"/>
    </linearGradient>

    <!-- Corner shine highlight along border ring -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Sparkle gradient: cyan to electric violet -->
    <linearGradient id="sparkleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <!-- Golden accent gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS Squircle Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>

  <!-- Border ring with corner shine -->
  <rect x="34" y="34" width="444" height="444" rx="98"
        fill="none"
        stroke="url(#shine)"
        stroke-width="5"/>

  <!-- Subtle translucent HUD circle -->
  <circle cx="256" cy="256" r="162"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.15"
          stroke-width="3"
          stroke-dasharray="8 6"/>

  <!-- Paperclip Symbol (Center) -->
  <g transform="translate(230, 260) rotate(45) scale(2.5) translate(-60, -60)">
    <path d="M54 50 v20 a 6 6 0 0 0 12 0 v-28 a 10 10 0 0 0 -20 0 v32 a 14 14 0 0 0 28 0 v-28"
          fill="none"
          stroke="#ffffff"
          stroke-width="5.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Primary Gemini AI Sparkle (Top Right) -->
  <g transform="translate(350, 150) scale(1.3)" filter="url(#glow)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z"
          fill="url(#sparkleGrad)"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Secondary Gemini Sparkle (Bottom Left) -->
  <g transform="translate(135, 365) scale(0.8)">
    <path d="M0 -24 Q0 0 24 0 Q0 0 0 24 Q0 0 -24 0 Q0 0 0 -24 Z"
          fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>

  <!-- Tertiary Micro Sparkle (Top Left) -->
  <g transform="translate(145, 145) scale(0.55)">
    <path d="M0 -18 Q0 0 18 0 Q0 0 0 18 Q0 0 -18 0 Q0 0 0 -18 Z"
          fill="#00F0FF"
          opacity="0.9"/>
  </g>
</svg>
